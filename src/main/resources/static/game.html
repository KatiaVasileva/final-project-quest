<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Игра — Прохождение</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<div class="container d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card bg-secondary text-white w-75 shadow-lg">
        <div class="card-header bg-warning text-dark fw-bold d-flex justify-content-between">
            <span>🎯 Игровой процесс квеста</span>
            <a href="index.html" class="btn btn-sm btn-dark">Вернуться на витрину</a>
        </div>
        <div class="card-body bg-light text-dark p-5 text-center">
            <h3 id="questionText" class="mb-5 fw-bold">Загрузка шага игры...</h3>
            <div id="answersBox" class="d-grid gap-3 col-8 mx-auto"></div>
        </div>
    </div>
</div>

<script src="auth.js"></script>
<script>
    const questId = localStorage.getItem('activeQuestId');
    if(!questId) window.location.href = 'index.html';

    async function initGame() {
        const res = await authenticatedFetch(`${BASE_URL}/game/start?questId=${questId}`, { method: 'POST' });
        renderStep(await res.json());
    }

    async function nextStep(answerId) {
        const res = await authenticatedFetch(`${BASE_URL}/game/play?answerId=${answerId}`, { method: 'POST' });
        renderStep(await res.json());
    }

    function renderStep(dto) {
        document.getElementById('questionText').innerText = `[Шаг ${dto.label}]: ${dto.text}`;
        const box = document.getElementById('answersBox');
        box.innerHTML = '';

        if (!dto.answers || dto.answers.length === 0) {
            box.innerHTML = `
                <div class="alert alert-dark fw-bold">🏁 Игра окончена! Статистика обновлена.</div>
                <a href="stats.html" class="btn btn-success">Открыть мою статистику</a>`;
            return;
        }

        dto.answers.forEach(a => {
            box.innerHTML += `<button onclick="nextStep(${a.id})" class="btn btn-outline-dark p-3 fw-bold text-start">📌 ${a.text}</button>`;
        });
    }

    initGame();
</script>
</body>
</html>
