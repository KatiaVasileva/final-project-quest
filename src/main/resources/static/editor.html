<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Конструктор квестов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .console-bg { background-color: #000 !important; color: #00ff00 !important; font-family: monospace; }
        .console-bg:focus { background-color: #000 !important; color: #fff !important; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="index.html">🎮 Quest World</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" href="index.html">Витрина</a>
            <a class="nav-link active" href="editor.html">Создать/редактировать квест</a>
            <a class="nav-link" href="stats.html">Статистика</a>
            <a class="nav-link text-danger" href="admin.html">Админ-панель</a>
        </div>
        <div id="navAuthSection"></div>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-md-5">
            <div class="card shadow-sm p-4">
                <h5 class="fw-bold mb-3">🛠️ Панель JSON операций</h5>
                <button onclick="fillTemplate()" class="btn btn-sm btn-outline-secondary mb-3">Загрузить пустой шаблон JSON</button>
                <div class="d-grid gap-2">
                    <button onclick="saveQuest()" class="btn btn-success btn-sm">Создать новый квест (POST)</button>
                    <div class="input-group">
                        <input type="number" id="questIdInput" class="form-control form-control-sm" placeholder="ID квеста">
                        <button onclick="updateQuest()" class="btn btn-warning btn-sm text-dark fw-bold">Изменить (PUT)</button>
                        <button onclick="deleteQuest()" class="btn btn-danger btn-sm">Удалить (DELETE)</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card shadow-sm p-3 bg-dark">
                <label for="jsonArea" class="text-white small mb-2 fw-bold">Структура данных JSON квеста:</label>
                <textarea id="jsonArea" class="form-control console-bg" rows="18" style="font-size: 12px;"></textarea>
            </div>
        </div>
    </div>
</div>

<script src="auth.js"></script>
<script>
    const editId = localStorage.getItem('editQuestId');
    if (editId) {
        localStorage.removeItem('editQuestId');
        loadQuest(editId);
    }

    async function loadQuest(id) {
        const res = await authenticatedFetch(`${BASE_URL}/quests/${id}`);
        const data = await res.json();
        document.getElementById('jsonArea').value = JSON.stringify(data, null, 2);
        document.getElementById('questIdInput').value = id;
    }

    async function saveQuest() {
        const txt = document.getElementById('jsonArea').value;
        const res = await authenticatedFetch(`${BASE_URL}/quests`, { method: 'POST', body: txt });
        if(res.ok) { alert("Квест успешно создан!"); window.location.href = 'index.html'; }
    }

    async function updateQuest() {
        const id = document.getElementById('questIdInput').value;
        const txt = document.getElementById('jsonArea').value;
        const res = await authenticatedFetch(`${BASE_URL}/quests/${id}`, { method: 'PUT', body: txt });
        if(res.ok) { alert("Данные обновлены!"); window.location.href = 'index.html'; }
    }

    async function deleteQuest() {
        const id = document.getElementById('questIdInput').value;
        if (!id) return alert("Укажите ID квеста для удаления!");
        if (!confirm(`Вы действительно хотите БЕЗВОЗВРАТНО удалить квест с ID ${id} и всю историю его прохождений?`)) return;

        try {
            const res = await authenticatedFetch(`${BASE_URL}/quests/${id}`, {
                method: 'DELETE'
            });

            if (res.ok) {
                document.getElementById('questIdInput').value = "";
                document.getElementById('jsonArea').value = "";

                window.location.href = 'index.html';
            } else {
                const errData = await res.json();
                alert("Ошибка удаления квеста: " + (errData.message || res.statusText));
            }
        } catch (e) {
            alert("Сетевая ошибка при удалении: " + e.message);
        }
    }

    function fillTemplate() {
        document.getElementById('jsonArea').value = JSON.stringify({
            title: "Новый квест", description: "Описание", text: "Сюжет", startQuestionId: null,
            questions: [{ label: "1", text: "Вопрос?", answers: [{ text: "Ответ", nextQuestionLabel: "+810" }] }]
        }, null, 2);
    }
</script>
</body>
</html>
