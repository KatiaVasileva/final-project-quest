<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная — Мир Квестов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>.api-card { border-left: 5px solid #0d6efd; }</style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="index.html">🎮 Quest World</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link active" href="index.html">Витрина</a>
            <a class="nav-link" href="editor.html">Создать/редактировать квест</a>
            <a class="nav-link" href="stats.html">Статистика</a>
            <a class="nav-link text-danger" href="admin.html">Админ-панель</a>
        </div>
        <div id="navAuthSection"></div>
    </div>
</nav>

<div class="container mb-5">
    <h2 class="mb-4 fw-bold text-center">✨ Доступные космические приключения</h2>
    <div id="questsContainer" class="row row-cols-1 row-cols-md-3 g-4">
    </div>
</div>

<script src="auth.js"></script>
<script>
    async function loadAllQuests() {
        const res = await authenticatedFetch(`${BASE_URL}/quests`, { method: 'GET' });
        const data = await res.json();
        const container = document.getElementById('questsContainer');
        container.innerHTML = '';

        data.forEach(q => {
            container.innerHTML += `
                <div class="col">
                    <div class="card h-100 api-card shadow-sm">
                        <div class="card-body d-flex flex-column justify-content-between">
                            <div>
                                <h5 class="card-title fw-bold">${q.title}</h5>
                                <p class="card-text text-muted small">${q.description}</p>
                            </div>
                            <div class="d-flex gap-2 mt-3">
                                <button onclick="playQuest(${q.id})" class="btn btn-primary btn-sm w-50">Играть</button>
                                <button onclick="editQuestDirect(${q.id})" class="btn btn-outline-warning btn-sm w-50 text-dark">Редактировать</button>
                            </div>
                        </div>
                    </div>
                </div>`;
        });
    }

    function playQuest(id) {
        if (!isUserLoggedIn()) { return window.location.href = 'login.html'; }
        localStorage.setItem('activeQuestId', id);
        window.location.href = 'game.html';
    }

    function editQuestDirect(id) {
        if (!isUserLoggedIn()) { return window.location.href = 'login.html'; }
        localStorage.setItem('editQuestId', id);
        window.location.href = 'editor.html';
    }

    loadAllQuests();
</script>
</body>
</html>
