<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моя Статистика</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="index.html">🎮 Quest World</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" href="index.html">Витрина</a>
            <a class="nav-link" href="editor.html">Создать/редактировать квест</a>
            <a class="nav-link active" href="stats.html">Статистика</a>
            <a class="nav-link text-danger" href="admin.html">Админ-панель</a>
        </div>
        <div id="navAuthSection"></div>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-md-5 mb-4">
            <div class="card shadow-sm p-4 text-center">
                <h4 class="fw-bold bg-secondary text-white p-2 rounded">Личный профиль</h4>
                <div id="personalBox" class="mt-4 fs-5">Загрузка данных...</div>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card shadow-sm p-4">
                <h4 class="fw-bold bg-dark text-white p-2 rounded text-center">🏆 Глобальная таблица лидеров</h4>
                <ol id="leaderboardList" class="list-group list-group-numbered mt-3"></ol>
            </div>
        </div>
    </div>
</div>

<script src="auth.js"></script>
<script>
    async function loadStatsData() {
        const res1 = await authenticatedFetch(`${BASE_URL}/stats`);
        const s = await res1.json();
        document.getElementById('personalBox').innerHTML = `
            <p>Игрок: <span class="badge bg-dark">${s.userLogin}</span></p>
            <p>Всего игр: <strong>${s.totalGames}</strong></p>
            <p class="text-success">Побед: <strong>${s.wins}</strong></p>
            <p class="text-danger">Поражений: <strong>${s.losses}</strong></p>
            <p>Коэффициент побед (WR): <strong>${s.winRate}%</strong></p>
            <p class="text-primary fw-bold">Место в мире: #${s.globalRank}</p>`;

        const res2 = await authenticatedFetch(`${BASE_URL}/stats/leaderboard`);
        const list = await res2.json();
        const ol = document.getElementById('leaderboardList');
        ol.innerHTML = '';
        list.forEach(user => {
            ol.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">
                <span class="fw-bold ms-2">${user.userLogin}</span>
                <span class="badge bg-success p-2">Побед: ${user.wins} (WR: ${user.winRate}%)</span>
            </li>`;
        });
    }
    loadStatsData();
</script>
</body>
</html>
