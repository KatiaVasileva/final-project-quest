<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="index.html">🎮 Quest World</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" href="index.html">Витрина</a>
            <a class="nav-link" href="editor.html">Создать/редактировать квест</a>
            <a class="nav-link" href="stats.html">Статистика</a>
            <a class="nav-link text-danger active" href="admin.html">Админ-панель</a>
        </div>
        <div id="navAuthSection"></div>
    </div>
</nav>

<div class="container mb-5">
    <div class="card shadow-sm p-4 mb-4 border-danger">
        <h4 class="text-danger fw-bold mb-4">🛡️ Управление пользователями приложения</h4>

        <div class="row g-2 mb-4 bg-white p-3 rounded border">
            <div class="col-md-2"><input type="text" id="adminUserLogin" class="form-control form-control-sm" placeholder="Логин"></div>
            <div class="col-md-3"><input type="email" id="adminUserEmail" class="form-control form-control-sm" placeholder="Email"></div>
            <div class="col-md-2">
                <input type="password" id="adminUserPass" class="form-control form-control-sm" placeholder="Пароль (только для нов.)">
            </div>
            <div class="col-md-2">
                <select id="adminUserRole" class="form-select form-select-sm">
                    <option value="USER">ROLE_USER</option>
                    <option value="ADMIN">ROLE_ADMIN</option>
                </select>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <input type="hidden" id="userIdTarget">

                <button onclick="createUser()" class="btn btn-success btn-sm w-50">Добавить</button>
                <button onclick="updateUser()" class="btn btn-warning btn-sm text-dark fw-bold w-50">Изменить</button>
            </div>
        </div>

        <table class="table table-striped table-hover border">
            <thead class="table-dark">
            <tr><th>ID</th><th>Логин</th><th>Email</th><th>Роль</th><th>Управление</th></tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
        </table>
    </div>
</div>

<script src="auth.js"></script>
<script>
    async function loadUsers() {
        const res = await authenticatedFetch(`${BASE_URL}/users`);
        if(!res.ok) {
            alert("У вас нет прав администратора для просмотра этой страницы!");
            window.location.href = 'index.html';
            return;
        }
        const data = await res.json();
        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = '';
        data.forEach(u => {
            tbody.innerHTML += `
                <tr>
                    <td><strong>${u.id}</strong></td>
                    <td>${u.login}</td>
                    <td>${u.email}</td>
                    <td><span class="badge bg-info">${u.role}</span></td>
                    <td>
                        <button onclick="prepareEdit(${u.id}, '${u.login}', '${u.email}', '${u.role}')" class="btn btn-sm btn-outline-warning text-dark me-1">Выбрать</button>
                        <button onclick="deleteUser(${u.id})" class="btn btn-sm btn-danger">Удалить</button>
                    </td>
                </tr>`;
        });
    }

    async function createUser() {
        const body = {
            login: document.getElementById('adminUserLogin').value,
            email: document.getElementById('adminUserEmail').value,
            password: document.getElementById('adminUserPass').value,
            role: document.getElementById('adminUserRole').value
        };

        const res = await authenticatedFetch(`${BASE_URL}/users`, { method: 'POST', body: JSON.stringify(body) });

        if (res.ok) {
            document.getElementById('userIdTarget').value = "";
            document.getElementById('adminUserLogin').value = "";
            document.getElementById('adminUserEmail').value = "";
            document.getElementById('adminUserPass').value = "";
            loadUsers();
        } else {
            const errData = await res.json();
            alert("Ошибка создания пользователя: " + (errData.message || res.statusText));
        }
    }

    async function updateUser() {
        const id = document.getElementById('userIdTarget').value;
        if (!id || id.trim() === "") {
            alert("Сначала выберите пользователя из таблицы с помощью кнопки 'Выбрать'!");
            return;
        }
        const body = {
            login: document.getElementById('adminUserLogin').value,
            email: document.getElementById('adminUserEmail').value,
            password: document.getElementById('adminUserPass').value,
            role: document.getElementById('adminUserRole').value
        };

        const res = await authenticatedFetch(`${BASE_URL}/users/${id}`, {
            method: 'PUT',
            body: JSON.stringify(body)
        });
        if (res.ok) {
            document.getElementById('userIdTarget').value = "";
            document.getElementById('adminUserLogin').value = "";
            document.getElementById('adminUserEmail').value = "";
            document.getElementById('adminUserPass').value = "";
            loadUsers();
        } else {
            const errData = await res.json();
            alert("Ошибка изменения: " + (errData.message || res.statusText));
        }
    }

    async function deleteUser(id) {
        if (!id) return;
        if (!confirm(`Вы действительно хотите БЕЗВОЗВРАТНО удалить пользователя с ID ${id}?`)) return;

        try {
            const res = await authenticatedFetch(`${BASE_URL}/users/${id}`, {
                method: 'DELETE'
            });

            if (res.ok) {
                loadUsers();
            } else {
                const errData = await res.json();
                alert("Ошибка удаления: " + (errData.message || res.statusText));
            }
        } catch (e) {
            alert("Сетевая ошибка при удалении: " + e.message);
        }
    }

    function prepareEdit(id, login, email, role) {
        document.getElementById('userIdTarget').value = id;
        document.getElementById('adminUserLogin').value = login;
        document.getElementById('adminUserEmail').value = email;
        document.getElementById('adminUserRole').value = role;
    }

    loadUsers();
</script>
</body>
</html>
